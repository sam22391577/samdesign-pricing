<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作品案例 · Design Studio</title>
  <meta name="description" content="Design Studio 設計作品案例">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-surface: #faf8f6;
      --color-surface-alt: #f0ebe5;
      --color-text: #5b4a3a;
      --color-text-light: #806d5c;
      --color-border: rgba(91, 74, 58, 0.18);
      --color-border-strong: rgba(91, 74, 58, 0.34);
      --color-accent: #806752;
      --color-accent-hover: #6f5846;
      --font-sans: "Noto Serif TC", serif;
      --radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      min-height: 100vh;
      color: var(--color-text);
      font-family: var(--font-sans);
      background:
        linear-gradient(180deg, rgba(250,248,246,0.75), rgba(240,235,229,0.85)),
        var(--color-surface);
    }
    a { color: inherit; text-decoration: none; }
    .container { width: min(1100px, calc(100% - 2rem)); margin: 0 auto; }
    .topbar {
      padding: 1.5rem 0;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.95rem;
      font-weight: 600;
    }
    .back-link:hover { color: var(--color-accent-hover); }
    main {
      min-height: calc(100vh - 84px);
      padding: 4rem 0 7rem;
    }
    .eyebrow {
      margin-bottom: 0.8rem;
      color: var(--color-text-light);
      font-family: "Cormorant Garamond", serif;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    h1 {
      margin-bottom: 1rem;
      font-size: clamp(2.8rem, 8vw, 5.5rem);
      font-weight: 600;
      line-height: 1.05;
    }
    .intro {
      max-width: 680px;
      color: var(--color-text-light);
      font-size: 1.08rem;
      line-height: 1.9;
    }
    .case-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 270px));
      gap: 2.75rem 1.5rem;
      margin-top: 5rem;
    }
    .case-card {
      position: relative;
      display: flex;
      aspect-ratio: 1.25 / 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      padding: 3.9rem 1.2rem 0.85rem;
      overflow: visible;
      text-align: center;
      background: rgba(250,248,246,0.9);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      box-shadow: 0 14px 35px rgba(91,74,58,0.08);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .case-card:hover {
      transform: translateY(-3px);
      border-color: var(--color-border-strong);
      box-shadow: 0 18px 42px rgba(91,74,58,0.13);
    }
    .profile-image {
      position: absolute;
      top: -54px;
      left: 50%;
      width: 120px;
      height: 120px;
      object-fit: cover;
      border: 5px solid var(--color-surface);
      border-radius: 50%;
      box-shadow: 0 8px 22px rgba(91,74,58,0.18);
      transform: translateX(-50%);
    }
    .case-label {
      margin-bottom: 0.22rem;
      color: var(--color-text-light);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.1em;
    }
    .case-name { font-size: 1.15rem; font-weight: 600; line-height: 1.5; }
    .case-username { margin-top: 0.15rem; color: var(--color-text-light); font-size: 0.9rem; }
    .view-text { margin-top: 0.45rem; color: var(--color-accent); font-size: 0.85rem; font-weight: 600; }

    @media (max-width: 560px) {
      main { padding-top: 2.5rem; }
      .case-grid {
        grid-template-columns: minmax(0, 270px);
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container">
      <a class="back-link" href="index.html">← 返回服務價目</a>
    </div>
  </header>

  <main>
    <div class="container">
      <p class="eyebrow">Selected Works</p>
      <h1>作品案例</h1>
      <p class="intro">點選下方帳號，即可前往 IG 查看實際設計作品與應用案例。</p>

      <div class="case-grid">
        <a class="case-card" href="https://www.instagram.com/elbowdao_bono/" target="_blank" rel="noopener">
          <img class="profile-image" src="assets/instagram/elbowdao-bono-profile.jpg" alt="BONO｜肘道 運動按摩頭貼">
          <div>
            <p class="case-label">INSTAGRAM</p>
            <h2 class="case-name">BONO｜肘道 運動按摩</h2>
            <p class="case-username">@elbowdao_bono</p>
            <p class="view-text">查看作品 →</p>
          </div>
        </a>
      </div>
    </div>
  </main>
</body>
</html>
